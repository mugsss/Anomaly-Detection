# CI/CD pipeline for the loan-tape onboarding platform.
#
# Five stages: lint, test (with coverage), synth the CDK stack, build the
# Part 1 Docker image, push to ECR. Runs on every push and pull request;
# the ECR push step runs only on main.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: loan-pipeline

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff==0.6.9
      - run: ruff check .

  test:
    name: Test (pytest + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt pytest-cov==5.0.0
      - run: pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=70
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  synth:
    name: Synth CDK (validate IaC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g aws-cdk@latest
      - working-directory: infra/cdk
        run: pip install -r requirements.txt
      - working-directory: infra/cdk
        run: cdk synth --quiet

  build:
    name: Build Part 1 pipeline image
    runs-on: ubuntu-latest
    needs: [lint, test, synth]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ${{ env.ECR_REPOSITORY }}:${{ github.sha }} .
      - run: docker save ${{ env.ECR_REPOSITORY }}:${{ github.sha }} -o loan-pipeline-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: loan-pipeline-image.tar
          retention-days: 3

  push:
    name: Push to ECR
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
      - run: docker load -i loan-pipeline-image.tar
      # Configure AWS credentials. Set these secrets in your repository
      # settings (Settings > Secrets and variables > Actions):
      #   AWS_ROLE_ARN  (preferred, for OIDC keyless auth)
      #   or AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login
      - run: |
          ECR_REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          docker tag ${{ env.ECR_REPOSITORY }}:${{ github.sha }} "$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          docker tag ${{ env.ECR_REPOSITORY }}:${{ github.sha }} "$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest"
          docker push "$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          docker push "$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest"
